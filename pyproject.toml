[project]
name = "denoise"
description = "Noise vector reconstruction for Level 1 Sentinel-1 products"
authors = [
  { name="Aresys S.R.L.", email="info@aresys.it" }
]
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
dynamic = ["version"]
license = { file = "LICENSE" }
dependencies = [
    # private wheels - installed separately by install.sh:
    #   arepytools
    #   arepyextras-eo-products
    "click",
    "colorlog",
    "lxml",
    "matplotlib",
    "numpy",
    "Pillow",
    "rasterio",
    "scipy",
    "tabulate",
    "xmltodict",
]

[project.scripts]
denoise = "denoise.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "denoise/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["denoise"]

[tool.hatch.build.targets.wheel.include]
patterns = ["denoise/aux_rules/**"]
