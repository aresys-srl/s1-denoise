[project]
name = "s1-denoise"
description = "Thermal noise vector reconstruction for Sentinel-1 Level 1 products"
authors = [
  { name="Aresys S.R.L.", email="info@aresys.it" }
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dynamic = ["version"]
license = { file = "LICENSE" }
dependencies = [
    "click",
    "colorlog",
    "lxml",
    "matplotlib",
    "numpy",
    "Pillow",
    "rasterio",
    "scipy",
    "sentinel1decoder",
    "xmltodict",
    "perseo-core"
]

[project.urls]
Homepage = "https://github.com/aresys-srl/s1-denoise"
Documentation = "https://opensource.aresys.it/s1-denoise/"
Repository = "https://github.com/aresys-srl/s1-denoise"
Issues = "https://github.com/aresys-srl/s1-denoise/issues"
Changelog = "https://opensource.aresys.it/s1-denoise/API/changelog/"

[project.scripts]
denoise = "s1_denoise.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/s1_denoise/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/s1_denoise"]

[tool.hatch.build.targets.sdist]
include = [
    "src/s1_denoise/**/*.py",
    "README.md",
    "LICENSE",
    "pyproject.toml",
    "scripts/compare_noise.py"
]
